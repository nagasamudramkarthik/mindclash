services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: mindclash-azurite
    command: ["azurite", "--location", "/data", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0"]
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - mindclash-azurite-data:/data
  redis:
    image: redis:7-alpine
    container_name: mindclash-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--user", "default", "off",
              "--user", "mindclash", "on", ">${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "~mindclash:*",
              "+ping", "+eval", "+get", "+getdel", "+set", "+del", "+expire", "+hgetall", "+hget",
              "+hset", "+hdel", "+zrem", "+zscore", "+zadd", "+zrangebyscore"]
    volumes:
      - mindclash-redis-data:/data
 
volumes:
  mindclash-azurite-data:
  mindclash-redis-data:
