name: Azure Functions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: sqlite://
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ""
          VITE_ENABLE_WEBSOCKETS: "false"
        run: |
          npm ci
          npm run build
      - name: Stage frontend for Functions
        run: cp -R frontend/dist backend/static
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --target=".python_packages/lib/site-packages" -r requirements.txt
      - name: Test backend and Functions entry point
        working-directory: backend
        env:
          PYTHONPATH: .python_packages/lib/site-packages
        run: |
          python -m unittest discover -v -p "test_*.py"
          python -c "import os,secrets; os.environ['JWT_SECRET']=secrets.token_hex(32); os.environ['MINDCLASH_USE_QUEUE_WORKER']='true'; os.environ['DATABASE_URL']='postgresql+psycopg://test:test@127.0.0.1:1/test'; import function_app; assert len(function_app.app.get_functions()) >= 2"
      - name: Upload Functions package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mindclash-function-package
          path: backend/
          if-no-files-found: error
          include-hidden-files: true
      - name: Sign in to Azure
        if: github.event_name != 'pull_request' && vars.AZURE_OIDC_ENABLED == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Function package
        if: github.event_name != 'pull_request' && vars.AZURE_OIDC_ENABLED == 'true'
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: backend
          scm-do-build-during-deployment: true
          enable-oryx-build: true
